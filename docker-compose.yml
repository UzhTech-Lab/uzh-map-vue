version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: uzh-map-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uzh_map
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks:
      - uzh-network

  # Backend API
  backend:
    build:
      context: ./uzh-map-backend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: uzh-map-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: uzh_map
      PORT: 3003
    ports:
      - "3003:3003"
    networks:
      - uzh-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./map_uzhorod
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    container_name: uzh-map-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - uzh-network
    restart: unless-stopped

volumes:
  db_data:

networks:
  uzh-network:
    driver: bridge
